<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyHyundai Deep Link Tester</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101820}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 14% 10%,rgba(0,170,210,.18),transparent 34%),radial-gradient(circle at 90% 90%,rgba(0,44,95,.14),transparent 30%),linear-gradient(145deg,#f7fcfd,#eaf6fa)}main{width:min(100%,560px);padding:40px;border:1px solid rgba(255,255,255,.8);border-radius:32px;background:rgba(255,255,255,.88);box-shadow:0 30px 90px rgba(0,44,95,.14);backdrop-filter:blur(18px)}.icon{display:grid;place-items:center;width:48px;height:48px;margin-bottom:30px;border-radius:16px;background:#002c5f;color:white;font-size:24px;font-weight:700}.eyebrow{margin:0 0 12px;color:#007fa8;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}h1{margin:0;font-size:clamp(30px,7vw,38px);letter-spacing:-.04em}p{color:#64748b;line-height:1.65}.links{display:grid;gap:16px;margin-top:34px}a{display:flex;align-items:center;gap:16px;min-height:80px;padding:16px 20px;border:1px solid #e2e8f0;border-radius:16px;background:#fff;color:inherit;text-decoration:none;transition:.2s}a:hover{transform:translateY(-2px);border-color:rgba(0,127,168,.45);box-shadow:0 14px 35px rgba(0,127,168,.12)}a:focus-visible{outline:4px solid rgba(0,170,210,.22)}.num{display:grid;place-items:center;flex:0 0 40px;height:40px;border-radius:12px;background:#e9f7fb;color:#007fa8;font-weight:800}.text{min-width:0;flex:1}.label{display:block;font-weight:700}.note{display:block;margin-top:5px;color:#64748b;font-size:12px}.arrow{color:#007fa8;font-size:20px}.footer{margin:26px 0 0;text-align:center;font-size:12px;color:#94a3b8}@media(max-width:520px){main{padding:28px 22px;border-radius:24px}}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">Aa</div>
    <p class="eyebrow">Deep Link Tester</p>
    <h1>选择要打开的链接</h1>
    <p>两个链接仅参数名大小写不同。请在已安装 MyHyundai 应用的设备上测试。</p>
    <div class="links">
      <a href="myhyundai://breadfinancial/pre-approval-order?clientName=hyundai&prescreenId=999999999995&channel=4" aria-label="打开 prescreenId 链接，参数名使用大写 I">
        <span class="num">1</span><span class="text"><span class="label">打开 prescreenId 链接</span><span class="note">参数名使用大写 I</span></span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="myhyundai://breadfinancial/pre-approval-order?clientName=hyundai&prescreenid=999999999995&channel=4" aria-label="打开 prescreenid 链接，参数名使用小写 i">
        <span class="num">2</span><span class="text"><span class="label">打开 prescreenid 链接</span><span class="note">参数名使用小写 i</span></span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </div>
    <p class="footer">点击后，浏览器会尝试唤起 MyHyundai 应用</p>
  </main>
</body>
</html>
